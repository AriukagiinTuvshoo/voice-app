name: Build VOICE Keyboard (Android APK & iOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-voice-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android VOICE Keyboard APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon

      - name: Prepare VOICE-Keyboard.apk
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk VOICE-Keyboard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-Keyboard-Android-APK
          path: VOICE-Keyboard.apk

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VOICE Keyboard v1.0 (Android & iOS)"
          body: |
            ### 🎤 VOICE Keyboard — Гар утасны системийн гар (Android & iOS)
            Chrome, Google хайлт, Facebook, Messenger, Instagram зэрэг бүх апп дээр Монгол, Англи, Япон хэлээр шууд ярьж бичих гар.
            - **Android:** Доорх `VOICE-Keyboard.apk` файлыг утсандаа татаж суулгана уу.
          files: VOICE-Keyboard.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-keyboard:
    name: Build iOS VOICE Keyboard Extension
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode project and build unsigned iOS app
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project VoiceKeyboard.xcodeproj \
            -scheme VoiceKeyboardApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
             SYMROOT="$PWD/build"
          mkdir -p Payload
          cp -r build/Release-iphoneos/VoiceKeyboardApp.app Payload/
          zip -r ../../VOICE-Keyboard-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-Keyboard-iOS-IPA
          path: VOICE-Keyboard-iOS.ipa

      - name: Attach iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: VOICE-Keyboard-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
