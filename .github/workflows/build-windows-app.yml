name: Build VOICE Windows Desktop App

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Windows Desktop App
        shell: pwsh
        run: |
          $dist = "dist\VOICE-Windows-Desktop"
          New-Item -ItemType Directory -Force -Path $dist

          # Copy Essential Files
          Copy-Item -Recurse -Force .next $dist\.next
          Copy-Item -Recurse -Force public $dist\public
          Copy-Item -Recurse -Force chrome-extension $dist\chrome-extension
          Copy-Item -Force package.json $dist\package.json
          Copy-Item -Force tts_server.py $dist\tts_server.py
          Copy-Item -Force requirements.txt $dist\requirements.txt
          Copy-Item -Force Start-VOICE.bat $dist\Start-VOICE.bat
          Copy-Item -Force Install-VOICE.bat $dist\Install-VOICE.bat
          Copy-Item -Force Uninstall-VOICE.bat $dist\Uninstall-VOICE.bat
          Copy-Item -Force README.md $dist\README.md

          # Zip package
          Compress-Archive -Path "$dist\*" -DestinationPath "VOICE-Windows-Desktop.zip" -Force
          Get-Item "VOICE-Windows-Desktop.zip" | Select-Object Name, Length

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-Windows-Desktop
          path: VOICE-Windows-Desktop.zip

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VOICE-Windows-Desktop.zip
          draft: false
          prerelease: false
