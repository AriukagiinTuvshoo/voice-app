name: CI

on:
  push:
    branches: [ "main", "fix/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "windows-latest", "ubuntu-latest" ]
        python-version: [ "3.10", "3.12" ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system audio dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev libportaudio2 libasound2-dev ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-tray.txt || python -m pip install pystray pillow || true
        pip install httpx

    - name: Python Compile Check
      run: |
        python -m py_compile voice_core.py tts_server.py diagnose_flowbar.py

    - name: Run Unit Tests
      env:
        VOICE_NO_BROWSER: "1"
      shell: bash
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee test_results.log

    - name: Push failure log to git
      if: failure()
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin ci-debug-log:ci-debug-log || git checkout -b ci-debug-log
        git checkout ci-debug-log
        cp test_results.log "ci-failure-${{ matrix.os }}-${{ matrix.python-version }}.log"
        git add "ci-failure-${{ matrix.os }}-${{ matrix.python-version }}.log"
        git commit -m "ci: debug failure log for ${{ matrix.os }}-${{ matrix.python-version }}" || true
        git push origin ci-debug-log || git push origin ci-debug-log --force || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
