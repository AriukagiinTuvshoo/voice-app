name: Release VOICE Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-tray.txt || python -m pip install pystray pillow || true
          pip install httpx

      - name: Python Compile Check
        run: |
          python -m py_compile voice_core.py tts_server.py diagnose_flowbar.py build_standalone_runtime.py

      - name: Run Unit Tests
        env:
          VOICE_NO_BROWSER: "1"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build-and-release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-tray.txt || python -m pip install pystray pillow || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Build static export (out/)
        run: npm run build

      - name: Download & Prepare Native AI Tools (FFmpeg & whisper.cpp)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "tools\ffmpeg" -Force | Out-Null
          New-Item -ItemType Directory -Path "tools\whisper.cpp\Release" -Force | Out-Null

          # 1. Download official Gyan.dev FFmpeg essentials if missing
          if (-not (Test-Path "tools\ffmpeg\ffmpeg.exe")) {
              Write-Host "Downloading FFmpeg essentials with libass..."
              $ffmpegZip = "$env:TEMP\ffmpeg.zip"
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpegZip
              Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force
              $ffmpegBin = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              Copy-Item -Path $ffmpegBin.FullName -Destination "tools\ffmpeg\ffmpeg.exe"
              Write-Host "FFmpeg installed successfully."
          }

          # 2. Download official whisper.cpp release binaries (pinned ggml-org v1.9.2)
          if (-not (Test-Path "tools\whisper.cpp\Release\whisper-cli.exe")) {
              Write-Host "Downloading whisper.cpp x64 binaries..."
              $whisperZip = "$env:TEMP\whisper.zip"
              Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip" -OutFile $whisperZip
              
              # Verify SHA-256 checksum
              $actualHash = (Get-FileHash -Path $whisperZip -Algorithm SHA256).Hash.ToLower()
              $expectedHash = "49dcc16de826f20bd53d44f947a1ae49dfa81f86cad67a64d80820cb192d674a"
              if ($actualHash -ne $expectedHash) {
                  Write-Error "whisper.cpp checksum mismatch: expected $expectedHash, got $actualHash"
                  exit 1
              }
              Write-Host "whisper.cpp SHA256 verified successfully: $actualHash"
              
              Expand-Archive -Path $whisperZip -DestinationPath "tools\whisper.cpp\Release" -Force
              Write-Host "whisper.cpp installed successfully."
          }

          # Test native binaries
          & "tools\ffmpeg\ffmpeg.exe" -version
          & "tools\whisper.cpp\Release\whisper-cli.exe" --help
          Get-ChildItem -Path "tools" -Recurse | Measure-Object -Property Length -Sum

      - name: Build Standalone Python Runtime (Option A)
        shell: powershell
        run: |
          python build_standalone_runtime.py
          & "runtime\python.exe" -c "import fastapi, uvicorn, edge_tts, sounddevice, miniaudio, pystray, PIL, tkinter; print('STANDALONE_PYTHON_VERIFIED')"

      - name: Build Standalone Installer (Inno Setup)
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc installer\voice-setup.iss
          Get-ChildItem -Path "dist"

      - name: Prepare Portable Zip Release Package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "dist\VOICE-Windows-$version.zip"
          $distDir = "dist-package"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          # Core scripts & modules
          $files = @(
            "Install-VOICE.bat", "Start-VOICE.bat", "Uninstall-VOICE.bat", "Diagnose-VOICE.bat",
            "make-shortcut.ps1", "tts_server.py", "voice_core.py", "mongolian_grammar.py",
            "voice_cloning.py", "audio_separator.py", "karaoke_ass.py", "auto_updater.py",
            "requirements.txt", "requirements-tray.txt", "requirements-offline.txt",
            "VERSION", "README.md", "LICENSE"
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item -Path $f -Destination $distDir }
          }

          if (Test-Path "public") { Copy-Item -Path "public" -Destination $distDir -Recurse }
          if (Test-Path "out") { Copy-Item -Path "out" -Destination $distDir -Recurse }
          if (Test-Path "tools") { Copy-Item -Path "tools" -Destination $distDir -Recurse }
          if (Test-Path "runtime") { Copy-Item -Path "runtime" -Destination $distDir -Recurse }

          # Compress to zip using .NET ZipFile
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resolvedDist = (Resolve-Path $distDir).Path
          $resolvedZip = [System.IO.Path]::GetFullPath($zipName)
          [System.IO.Compression.ZipFile]::CreateFromDirectory($resolvedDist, $resolvedZip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Remove-Item -Path $distDir -Recurse -Force
          Write-Host "Created portable release package: $zipName"
          Get-Item $zipName | Select-Object Name, Length

      - name: Generate Checksums
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $installer = Get-ChildItem -Path "dist" -Filter "VOICE-Setup-*.exe" | Select-Object -First 1
          $zip = Get-ChildItem -Path "dist" -Filter "VOICE-Windows-*.zip" | Select-Object -First 1
          
          $hashes = @()
          if ($installer) {
            $h1 = Get-FileHash -Path $installer.FullName -Algorithm SHA256
            $hashes += "$($h1.Hash.ToLower())  $($installer.Name)"
          }
          if ($zip) {
            $h2 = Get-FileHash -Path $zip.FullName -Algorithm SHA256
            $hashes += "$($h2.Hash.ToLower())  $($zip.Name)"
          }
          $hashes | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VOICE-Setup-*.exe
            dist/VOICE-Windows-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
