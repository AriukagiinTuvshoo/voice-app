<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="112" height="56" rx="32" fill="url(#glow)" />
  
  <!-- Soundwave Bars & Microphone -->
  <g fill="#ffffff">
    <!-- Center Mic Capsule -->
    <rect x="52" y="32" width="24" height="42" rx="12" />
    <path d="M40 56 c0 15 10 26 24 26 s24 -11 24 -26" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="64" y1="82" x2="64" y2="98" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="98" x2="78" y2="98" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Dynamic sound accent dots -->
    <circle cx="26" cy="64" r="4" opacity="0.8" />
    <circle cx="102" cy="64" r="4" opacity="0.8" />
  </g>
</svg>
