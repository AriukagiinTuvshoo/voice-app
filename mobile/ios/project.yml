name: VoiceKeyboard
options:
  bundleIdPrefix: mn.voice
  deploymentTarget:
    iOS: "15.0"
targets:
  VoiceKeyboardApp:
    type: application
    platform: iOS
    sources:
      - VoiceKeyboardApp
    info:
      path: VoiceKeyboardApp/Info.plist
      properties:
        CFBundleDisplayName: VOICE Keyboard
        NSMicrophoneUsageDescription: "VOICE Keyboard нь таны яриаг текст болгохын тулд микрофон ашиглана."
        UILaunchScreen: {}
    dependencies:
      - target: VoiceKeyboardExtension
  VoiceKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - VoiceKeyboardExtension
    info:
      path: VoiceKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: VOICE Keyboard
        NSMicrophoneUsageDescription: "VOICE Keyboard нь таны яриаг текст болгохын тулд микрофон ашиглана."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mn
            RequestsOpenAccess: true
