<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      margin: 0;
    }
    h2 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.5; margin: 0 0 12px; }
    .shortcut-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid #6366f1;
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    label { font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 4px; }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      background: #6366f1;
      border: none;
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .status { font-size: 11px; color: #10b981; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <h2>🎤 VOICE Chrome Өргөтгөл</h2>
  <p>Google хайлт, Facebook, YouTube, Messenger зэрэг бүх сайт дээр курсороо тавиад шууд ярьж бичнэ.</p>
  
  <div class="shortcut-badge">Товчлуур: Alt + Shift + V</div>

  <label for="lang">Таних хэл:</label>
  <select id="lang">
    <option value="mn">🇲🇳 Монгол (+EN/JP холимог)</option>
    <option value="auto">🌐 Автомат (MN / EN / JA)</option>
    <option value="en">🇺🇸 English</option>
    <option value="ja">🇯🇵 日本語 (Япон)</option>
  </select>

  <label for="server">VOICE Серверийн хаяг:</label>
  <input type="text" id="server" value="https://voice-app.onrender.com" />

  <button id="save">Тохиргоо хадгалах</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
