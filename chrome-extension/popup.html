<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      margin: 0;
      box-sizing: border-box;
    }
    h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; margin: 0 0 14px; }
    
    .mic-big-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #ffffff;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .mic-big-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .mic-big-btn.recording {
      background: #ef4444;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
    }

    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #6366f1;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #1e293b;
      font-size: 12px;
      cursor: pointer;
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #a5b4fc;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .save-btn:hover {
      background: #2e3a59;
      color: #fff;
    }

    .status {
      font-size: 11px;
      color: #10b981;
      margin-top: 8px;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h2>🎤 VOICE — Яриа Танигч</h2>
  <p>Курсороо бичих нүдэн дээр тавиад доорх товчоор эсвэл өөрийн сонгосон товчоор ярина уу.</p>

  <!-- Big Interactive Direct Dictation Button -->
  <button id="directMicBtn" class="mic-big-btn">
    <span style="font-size: 18px;">🎤</span>
    <span id="directMicText">Дарж ярих (Эхлүүлэх)</span>
  </button>

  <div class="form-group">
    <label for="shortcutSelect">⌨️ Шууд ярих товчлуур сонгох:</label>
    <select id="shortcutSelect">
      <option value="F8">F8 (Хамгийн хялбар - 1 товчлуураар)</option>
      <option value="F2">F2 (1 товчлуураар)</option>
      <option value="Ctrl+Space">Ctrl + Space</option>
      <option value="Ctrl+Alt">Ctrl + Alt</option>
      <option value="Alt+Shift+V">Alt + Shift + V</option>
    </select>
  </div>

  <div class="form-group">
    <label for="lang">🌐 Таних хэл:</label>
    <select id="lang">
      <option value="mn">🇲🇳 Монгол (+EN/JP холимог)</option>
      <option value="auto">🌐 Автомат (MN / EN / JA)</option>
      <option value="en">🇺🇸 English</option>
      <option value="ja">🇯🇵 日本語 (Япон)</option>
    </select>
  </div>

  <label class="toggle-row">
    <span>Дэлгэц дээр хөвөгч 🎤 товч гаргах</span>
    <input type="checkbox" id="showFloatingMic" checked />
  </label>

  <div class="form-group" style="margin-top: 8px;">
    <label for="server">VOICE Серверийн хаяг:</label>
    <input type="text" id="server" value="https://voice-app.onrender.com" />
  </div>

  <button id="save" class="save-btn">💾 Тохиргоо хадгалах</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
